services:
  - type: web
    name: callejaspin
    runtime: node
    rootDir: backend
    buildCommand: npm run build:all
    startCommand: npm start
    healthCheckPath: /api/test/db
    plan: free
    envVars:
      - key: PORT
        value: 3000
      - key: ALLOWED_ORIGINS
        value: ""
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
